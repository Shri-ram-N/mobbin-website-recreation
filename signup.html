            <section class="text">
                <h1>Sign up</h1>
                <p>Welcome!</p>
            </section>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" class="input-1" required placeholder="Your name">
                <label for="email">Email address</label>
                <input type="email" id="email" class="input-1" required placeholder="Your email address">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-1" required placeholder="Password">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" class="input-1" required placeholder="Confirm Password">
                <div class="terms">
                    <input type="checkbox" required name="checkbox" id="checkbox">

                </div>
                <button class="login-btn">Sign in</button>
            </form>
            <h4 class="or">OR</h4>
